[project]
name = "ai-voice-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nayab", email = "nayabgauhar8@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "langchain-google-community[gmail]>=5.1.0",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "ngrok>=1.7.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "twilio>=9.11.2",
    "uvicorn[standard]>=0.54.0",
    "vonage>=4.9.0",
    "websockets>=16.1.1",
]

[project.scripts]
ai-voice-agent = "ai_voice_agent:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
